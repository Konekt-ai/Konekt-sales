<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konekt Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120; --ink-soft:#232B3D; --muted:#5A6478;
  --line:#E6EAF2; --paper:#fff; --app:#EDEFF5; --soft:#F3F6FD; --tint:#EDF2FF;
  --blue:#2D6BF5; --blue-2:#1E52E6; --blue-deep:#123AC4; --teal:#2FD3B6;
  --green:#16B981; --amber:#F5A524; --red:#E15B68;
  --grad-blue:linear-gradient(135deg,#2D6BF5,#1E52E6);
  --grad-brand:linear-gradient(115deg,#2D6BF5,#2FD3B6);
  --fd:"Plus Jakarta Sans",system-ui,sans-serif;
  --fb:"Inter",system-ui,sans-serif;
  --fm:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:var(--app);-webkit-font-smoothing:antialiased}
.g{color:var(--blue)}
svg.ico{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);display:inline-flex;align-items:center;gap:8px}
.kicker .ast{width:12px;height:12px;color:var(--teal)}
.ast{fill:none}

/* ================= LAYOUT ================= */
.app{display:grid;grid-template-columns:246px 1fr;height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.side .logo{padding:20px 20px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
.side .logo img{height:26px}
.side .logo .tag{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.navgroup{padding:14px 12px 4px}
.navgroup .gl{font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;transition:.12s;position:relative}
.nav .ico{width:17px;height:17px;color:var(--muted)}
.nav:hover{background:var(--soft)}
.nav.active{background:var(--tint);color:var(--blue)}
.nav.active .ico{color:var(--blue)}
.nav.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad-brand)}
.nav .badge{margin-left:auto;font-family:var(--fm);font-size:10px;background:var(--tint);color:var(--blue);border-radius:999px;padding:2px 7px;font-weight:700}
.side .user{margin-top:auto;padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--grad-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:13px}
.side .user .nm{font-size:13px;font-weight:700}
.side .user .rl{font-size:11px;color:var(--muted)}

/* topbar + content */
.main{overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:16px}
.topbar h1{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.02em}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.topbar .spacer{flex:1}
.btn{font-family:var(--fb);font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:#cbd2e2}
.btn .ico{width:15px;height:15px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-2)}
.btn.ghost{border:0;background:var(--soft)}
.content{padding:26px 30px 70px;flex:1}

/* ================= COMPONENTES ================= */
.grid{display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.statgrid{grid-template-columns:repeat(3,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.stat .lb{font-family:var(--fm);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .big{font-family:var(--fd);font-weight:800;font-size:32px;letter-spacing:-.02em;margin-top:8px}
.stat .big.g{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .dl{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat .cico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center}
.stat .cico .ico{width:17px;height:17px}

.sech{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.sech h2{font-family:var(--fd);font-weight:800;font-size:18px;letter-spacing:-.02em}
.sech .spacer{flex:1}

/* tareas / agenda */
.task{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.task .hora{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--blue);min-width:52px}
.task .tx{flex:1}
.task .tx .t{font-size:13.5px;font-weight:600}
.task .tx .p{font-size:11.5px;color:var(--muted)}
.task .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.task.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.task.done .tx .t{text-decoration:line-through;color:var(--muted)}
.pill{font-family:var(--fm);font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.pill.call{background:#EAF0FF;color:var(--blue)} .pill.demo{background:#E7FBF5;color:#0E9E82}
.pill.follow{background:#FFF3E0;color:#B26B00} .pill.task{background:var(--soft);color:var(--muted)}

/* ================= KANBAN ================= */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:236px;gap:14px;overflow-x:auto;padding-bottom:14px}
.kcol{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.kcol.dragover{outline:2px dashed var(--blue);outline-offset:-4px;background:var(--tint)}
.kcol .kh{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-family:var(--fd);font-weight:700;font-size:12px}
.kcol .kh .dot{width:8px;height:8px;border-radius:50%}
.kcol .kh .n{margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.12s}
.kcard:hover{border-color:#B9C6EF;box-shadow:0 6px 16px rgba(11,17,32,.07)}
.kcard.drag{opacity:.4}
.kcard .co{font-family:var(--fd);font-weight:700;font-size:13.5px}
.kcard .nm{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.kcard .sv{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px}
.kcard .row{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.kcard .val{font-family:var(--fd);font-weight:800;color:var(--ink)}
.kcard .meta{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.dotint{width:7px;height:7px;border-radius:50%}
.int-alto{background:var(--green)} .int-medio{background:var(--amber)} .int-bajo{background:var(--muted)}

/* ================= FICHA PROSPECTO ================= */
.phead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;gap:20px;align-items:flex-start;position:relative;overflow:hidden}
.phead .ast-bg{position:absolute;right:-40px;top:-40px;width:180px;height:180px;color:var(--blue);opacity:.05}
.phead .big-av{width:56px;height:56px;border-radius:14px;background:var(--grad-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:20px;flex:none}
.phead h2{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.02em}
.phead .co{font-size:13px;color:var(--muted);margin-top:2px}
.phead .rowd{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
.phead .rowd .k{font-family:var(--fm);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.phead .rowd .v{font-size:13px;font-weight:600;margin-top:3px}
.phead .actions{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.stagechip{font-family:var(--fd);font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:999px;color:#fff}

.tabs{display:flex;gap:4px;margin:20px 0 16px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--fd);font-weight:600;font-size:13px;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--blue);border-color:var(--blue)}
.cols2{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.dl-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl-row:last-child{border-bottom:0}
.dl-row .k{color:var(--muted)} .dl-row .v{font-weight:600;text-align:right;max-width:60%}

/* Konekt AI card */
.aicard{border-radius:18px;padding:2px;background:var(--grad-brand)}
.aicard .in{background:var(--ink);border-radius:16px;padding:20px;color:#fff;position:relative;overflow:hidden}
.aicard .ast-bg{position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;color:#fff;opacity:.10}
.aicard .hd{display:flex;align-items:center;gap:9px;margin-bottom:14px;position:relative;z-index:1}
.aicard .hd .ico{width:15px;height:15px;color:var(--teal)}
.aicard .hd b{font-family:var(--fd);font-weight:800;font-size:14px}
.aicard .hd .tagai{margin-left:auto;font-family:var(--fm);font-size:9px;color:#9FE7DA;border:1px solid rgba(47,211,182,.4);border-radius:999px;padding:2px 8px}
.aicard .rowai{position:relative;z-index:1;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:12.5px;display:flex;justify-content:space-between;gap:12px}
.aicard .rowai:last-of-type{border-bottom:0}
.aicard .rowai .k{color:#9FB0D8;font-family:var(--fm);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.aicard .rowai .v{font-weight:700;text-align:right}
.aicard .accion{background:rgba(47,211,182,.12);border:1px solid rgba(47,211,182,.3);border-radius:10px;padding:12px;margin-top:12px;font-size:12.5px;position:relative;z-index:1;line-height:1.5}
.aicard .prob{position:relative;z-index:1;margin-top:12px}
.probbar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.probbar>span{display:block;height:100%;background:var(--grad-brand);border-radius:99px}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tlitem{position:relative;padding:0 0 20px}
.tlitem::before{content:"";position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.tlitem.teal::before{border-color:var(--teal)} .tlitem.mut::before{border-color:var(--line)}
.tlitem .dt{font-family:var(--fm);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tlitem .tx{font-size:13.5px;font-weight:600;margin-top:3px}
.tlitem .sub{font-size:12px;color:var(--muted);margin-top:2px}

/* botones grandes generar */
.gengrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.genbtn{border:0;border-radius:14px;padding:18px;text-align:left;cursor:pointer;color:#fff;position:relative;overflow:hidden;font-family:var(--fd)}
.genbtn.prop{background:var(--grad-blue)} .genbtn.cot{background:var(--ink)}
.genbtn .ico{width:22px;height:22px;margin-bottom:10px;display:block}
.genbtn .t{font-weight:800;font-size:15px}
.genbtn .s{font-size:11.5px;opacity:.85;margin-top:3px;font-family:var(--fb)}
.genbtn .ast-bg{position:absolute;right:-20px;bottom:-30px;width:120px;height:120px;color:#fff;opacity:.12}

/* progress pagos */
.progwrap{margin:14px 0}
.progbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.progbar>span{display:block;height:100%;background:var(--grad-brand)}
.payrow{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.payrow .pn{font-family:var(--fd);font-weight:700;font-size:13px;min-width:60px}
.payrow .pct{font-family:var(--fm);font-size:12px;color:var(--muted);min-width:44px}
.payrow .amt{font-family:var(--fd);font-weight:800;flex:1}
.state{font-family:var(--fm);font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.state.ok{background:#E7FBF5;color:#0E9E82} .state.pend{background:#FFF3E0;color:#B26B00}

/* calendario */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calswitch{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.calswitch button{border:0;background:transparent;font-family:var(--fb);font-weight:600;font-size:12.5px;color:var(--muted);padding:7px 13px;border-radius:7px;cursor:pointer}
.calswitch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(11,17,32,.08)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.caldow{font-family:var(--fm);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.calcell{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:92px;padding:8px;cursor:pointer;transition:.12s}
.calcell:hover{border-color:#B9C6EF}
.calcell.off{background:var(--soft);opacity:.5;cursor:default}
.calcell.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.calcell .dn{font-family:var(--fd);font-weight:700;font-size:12px}
.calev{font-size:10px;border-radius:5px;padding:2px 5px;margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calev.call{background:#EAF0FF;color:var(--blue)} .calev.demo{background:#E7FBF5;color:#0E9E82}
.calev.follow{background:#FFF3E0;color:#B26B00} .calev.pay{background:#FCEBED;color:#C0344A}

/* tabla admin */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--fm);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink)}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td{padding:12px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:var(--soft)}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;background:var(--grad-brand)}


.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.breadcrumb .st{display:inline-flex;align-items:center;gap:6px}
.breadcrumb .cur{color:var(--blue);font-weight:700}
.link{color:var(--blue);cursor:pointer;font-weight:600}

@media (max-width:1100px){.cols2{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}}

/* ===== GENERADOR · estilos aprobados ===== */


:root{
  --ink:#0B1120; --ink-soft:#232B3D; --muted:#5A6478;
  --line:#E6EAF2; --paper:#fff; --app:#EDEFF5; --soft:#F3F6FD; --tint:#EDF2FF;
  --blue:#2D6BF5; --blue-2:#1E52E6; --blue-deep:#123AC4; --teal:#2FD3B6;
  --grad-blue:linear-gradient(135deg,#2D6BF5,#1E52E6);
  --grad-brand:linear-gradient(115deg,#2D6BF5,#2FD3B6);
  --fd:"Plus Jakarta Sans",system-ui,sans-serif;
  --fb:"Inter",system-ui,sans-serif;
  --fm:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:var(--app);-webkit-font-smoothing:antialiased}
.g{color:var(--blue)}
.ast{fill:none}
svg.ico{display:inline-block;vertical-align:middle}

/* barra */
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:12px 22px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.appbar .brand{display:flex;align-items:center;gap:11px}
.appbar .brand img{height:23px}
.appbar .brand .sep{width:1px;height:20px;background:var(--line)}
.appbar .brand span{color:var(--muted);font-size:12.5px;font-weight:500}
.switch{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.switch button{font-family:var(--fb);font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 15px;border-radius:8px;cursor:pointer;transition:.15s}
.switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,17,32,.10)}
.appbar .spacer{flex:1}
.btn{font-family:var(--fb);font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;transition:.15s}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-2);border-color:var(--blue-2)}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:9px 16px;background:#fff;border-bottom:1px solid var(--line)}
.hint kbd{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--ink)}

.stage{padding:32px 16px 90px;display:flex;justify-content:center}
.doc{width:830px;max-width:100%;background:var(--paper);box-shadow:0 16px 50px rgba(11,17,32,.12);border-radius:6px;overflow:hidden;animation:rise .32s ease;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none}
.logo-slot{position:relative;cursor:pointer;display:inline-flex}
.logo-slot::after{content:"Cambiar";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;background:rgba(11,17,32,.55);opacity:0;border-radius:10px;transition:.15s}
.logo-slot:hover::after{opacity:1}
.logo-slot input{display:none}

/* ============================================================
   PROPUESTA · editorial-tech con firma de asterisco
   ============================================================ */
.konekt{height:40px;display:block}
.pill-logo{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:6px 10px}
.pill-logo img{height:22px}

/* etiqueta mono con asterisco */
.kicker{font-family:var(--fm);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);display:inline-flex;align-items:center;gap:9px}
.kicker .ico{width:13px;height:13px;color:var(--teal)}

/* asteriscos ambientales */
.ast-bg{position:absolute;color:var(--blue);opacity:.05;pointer-events:none}
.ast-spin{animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* running header dentro del doc */
.runhead{display:flex;justify-content:space-between;align-items:center;padding:14px 56px;border-bottom:1px solid var(--line);font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.runhead b{color:var(--ink);font-weight:700}
.runhead .mid{display:flex;align-items:center;gap:8px}
.runhead .ico{width:12px;height:12px;color:var(--blue)}

/* portada */
.cover{position:relative;overflow:hidden;padding:48px 56px 42px;background:#fff}
.cover .ast-hero{top:-90px;right:-90px;width:340px;height:340px}
.cover .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:44px;position:relative;z-index:1}
.clogo{width:150px;height:62px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.clogo img{max-width:100%;max-height:100%;object-fit:contain}
.cover h1{font-family:var(--fd);font-weight:800;letter-spacing:-.035em;font-size:62px;line-height:.95;margin:18px 0 22px;max-width:13ch;position:relative;z-index:1}
.cover .lead{font-size:15px;color:var(--muted);max-width:52ch;line-height:1.6;position:relative;z-index:1}

.hero-band{margin-top:32px;background:var(--grad-blue);border-radius:22px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;gap:22px;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hero-band .ast-bg{color:#fff;opacity:.10;top:-40px;right:60px;width:200px;height:200px}
.hero-band .lead2{color:#fff;position:relative;z-index:1}
.hero-band .lead2 .t{font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.2;max-width:22ch}
.hero-band .lead2 .s{font-family:var(--fm);font-size:11px;color:#CBD8FF;margin-top:10px;max-width:40ch;line-height:1.6;letter-spacing:.02em}
.callout{background:#fff;border-radius:16px;padding:16px 22px;box-shadow:0 14px 34px rgba(11,17,32,.26);text-align:center;min-width:150px;position:relative;z-index:1}
.callout .big{font-family:var(--fd);font-weight:800;font-size:34px;letter-spacing:-.02em;color:var(--blue)}
.callout .lb{font-family:var(--fm);font-size:9.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}

.cover .meta{display:flex;gap:30px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);position:relative;z-index:1}
.cover .meta .k{font-family:var(--fm);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:9px;margin-bottom:6px}
.cover .meta .v{font-family:var(--fd);font-weight:600;font-size:13px}
.cover .by{margin-left:auto;display:flex;align-items:center;gap:9px}
.cover .by small{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cover .by img{height:26px}

/* secciones */
.sec{padding:44px 56px;border-top:1px solid var(--line);position:relative;overflow:hidden}
.sec .ast-bg{width:200px;height:200px;bottom:-60px;left:-50px}
.sec h2{font-family:var(--fd);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1.03;max-width:18ch;margin-top:12px}
.sec .sub{font-size:14px;color:var(--muted);margin:12px 0 24px;max-width:60ch;line-height:1.6}
.ph{color:#aeb4c4}

/* tarjetas numeradas alternadas */
.numcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative;z-index:1}
.ncard{border-radius:16px;padding:22px;min-height:158px;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ncard .n{font-family:var(--fm);font-weight:700;font-size:13px;letter-spacing:.05em;margin-bottom:auto}
.ncard h3{font-family:var(--fd);font-weight:700;font-size:16px;margin:26px 0 8px;line-height:1.15}
.ncard p{font-size:12px;line-height:1.55}
.ncard.dark{background:var(--ink);color:#fff}.ncard.dark p{color:#AAB2C4}.ncard.dark .n{color:var(--teal)}
.ncard.blue{background:var(--grad-blue);color:#fff}.ncard.blue p{color:#D8E2FF}.ncard.blue .n{color:#fff}
.ncard.lite{background:var(--tint);color:var(--ink)}.ncard.lite p{color:var(--muted)}.ncard.lite .n{color:var(--blue)}

/* panel solución */
.solpanel{background:var(--grad-blue);border-radius:22px;padding:30px 32px;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;position:relative;overflow:hidden;z-index:1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.solpanel .ast-bg{color:#fff;opacity:.08;bottom:-70px;right:-50px;width:230px;height:230px}
.solpanel h3{font-family:var(--fd);font-weight:700;font-size:21px;margin-bottom:10px;position:relative;z-index:1}
.solpanel p{font-size:13px;color:#D8E2FF;line-height:1.6;position:relative;z-index:1}
.keybox{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:18px;position:relative;z-index:1}
.keybox .kt{font-family:var(--fm);font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#CBD8FF;margin-bottom:14px}
.keybox .ki{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#EAF0FF;margin-bottom:11px;line-height:1.4}
.keybox .ki:last-child{margin-bottom:0}
.keybox .ico{width:14px;height:14px;color:var(--teal);flex:none;margin-top:2px}

/* módulos */
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;position:relative;z-index:1}
.mod{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}
.mod .b{font-family:var(--fm);font-weight:700;font-size:12px;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.mod .b .ico{width:11px;height:11px;color:var(--teal)}
.mod h4{font-family:var(--fd);font-weight:700;font-size:14.5px;margin-bottom:6px;line-height:1.15}
.mod p{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.mod .tag{display:inline-block;font-family:var(--fm);font-weight:400;font-size:10px;color:var(--blue);background:var(--tint);border-radius:6px;padding:5px 9px;letter-spacing:.02em}

/* impacto · momento a página completa */
.impact{background:var(--blue-deep);color:#fff;padding:52px 56px;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.impact .ast-bg{color:#fff;opacity:.09;top:-70px;right:-70px;width:320px;height:320px}
.impact .kicker{color:#9FE7DA}
.impact .kicker .ico{color:var(--teal)}
.impact h2{color:#fff;position:relative;z-index:1}
.impact .sub{color:#B7C4E6;position:relative;z-index:1}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;z-index:1;margin-top:6px}
.metric{padding:4px 20px}
.metric:first-child{padding-left:0}
.metric+.metric{border-left:1px solid rgba(255,255,255,.18)}
.metric .big{font-family:var(--fd);font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1;color:#fff}
.metric .lb{font-family:var(--fd);font-weight:600;font-size:13px;margin-top:10px}
.metric .ds{font-family:var(--fm);font-size:10px;color:#9FB0D8;margin-top:5px;line-height:1.4;letter-spacing:.03em}

/* roadmap */
.road{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.rp{display:grid;grid-template-columns:42px 1fr auto;gap:16px;align-items:center;padding:17px 0;border-bottom:1px dashed var(--line)}
.rp:last-child{border-bottom:0}
.rp .dot{width:42px;height:42px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.rp .dot .ico{width:20px;height:20px}
.rp .e{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.rp h4{font-family:var(--fd);font-weight:700;font-size:15px;margin:4px 0 3px}
.rp p{font-size:12px;color:var(--muted);line-height:1.5}
.rp .dur{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink);text-align:right;white-space:nowrap}
.rp .dur small{font-family:var(--fm);display:block;font-size:9px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:400;margin-top:2px}

/* cierre */
.close{padding:44px 56px}
.closebox{background:var(--ink);border-radius:24px;padding:38px;color:#fff;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.closebox .ast-bg{color:var(--blue);opacity:.3;top:-60px;right:-50px;width:260px;height:260px}
.closebox .kicker{color:var(--teal)}
.closebox h2{font-family:var(--fd);font-weight:800;font-size:32px;margin:12px 0 12px;position:relative;z-index:1}
.closebox p{font-size:14px;color:#AAB2C4;max-width:50ch;line-height:1.6;margin-bottom:24px;position:relative;z-index:1}
.closebox .go{display:inline-flex;background:#fff;color:var(--ink);font-family:var(--fd);font-weight:700;font-size:13.5px;padding:12px 20px;border-radius:11px;position:relative;z-index:1}
.closebox .foot{position:absolute;right:36px;bottom:32px;display:flex;align-items:center;gap:10px;z-index:1}
.closebox .foot span{font-family:var(--fm);font-size:10px;color:#cfd5e2;letter-spacing:.04em}

/* ============================================================
   COTIZACIÓN  ·  (aprobada, sin cambios)
   ============================================================ */
.quote{padding:44px 52px 38px}
.qtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}
.qtop .konekt{height:44px}
.qtop .client{text-align:right;font-size:12px;color:#4A4F60;line-height:1.7}
.qtop .client b{color:var(--ink);font-family:var(--fd);font-size:14px;display:block;margin-bottom:2px}
.q-eyebrow{font-family:var(--fd);font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.quote h1{font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.qmeta{display:flex;gap:40px;margin:18px 0 6px;padding:16px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.qmeta .k{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.qmeta .v{font-size:13px;font-weight:500}
table.cot{width:100%;border-collapse:collapse;margin:22px 0 18px;font-size:13px}
table.cot thead th{text-align:left;font-family:var(--fd);font-size:12px;font-weight:700;color:#fff;background:var(--ink);padding:12px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.cot thead th.num{text-align:right}
table.cot thead th:first-child{border-radius:9px 0 0 9px}
table.cot thead th:last-child{border-radius:0 9px 9px 0}
table.cot tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
table.cot tbody td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.totrow{display:flex;justify-content:flex-end;margin-bottom:24px}
.totbox{width:300px}
.totbox .l{display:flex;justify-content:space-between;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.totbox .l span:first-child{color:var(--muted)}
.totbox .l .a{font-variant-numeric:tabular-nums;font-weight:500}
.totbox .grand{background:var(--grad-blue);border-radius:12px;padding:14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.totbox .grand span:first-child{font-family:var(--fd);font-weight:700;font-size:14px}
.totbox .grand .a{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:-.02em}
.qcols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-bottom:22px}
.qblock .bt{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.qblock ol{margin:0;padding-left:16px}
.qblock li{font-size:11.5px;color:#4A4F60;line-height:1.7;margin-bottom:2px}
.etapas{border-collapse:collapse;width:100%}
.etapas td,.etapas th{border:1px solid var(--line);padding:9px 10px;text-align:center;font-size:12px}
.etapas th{background:var(--tint);font-family:var(--fd);font-weight:700;color:var(--ink)}
.etapas td{font-variant-numeric:tabular-nums;font-weight:500}
.qfoot{display:flex;justify-content:space-between;align-items:center;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.qfoot b{color:var(--ink);font-family:var(--fd)}

@media print{
  .appbar,.hint{display:none!important}.stage{padding:0}
  .doc{box-shadow:none;border-radius:0;width:100%}.no-print{display:none!important}
  .ast-spin{animation:none}
  @page{size:A4;margin:11mm}
  .sec,.cover,.close,.impact,.numcards,.solpanel,table.cot,.qcols{page-break-inside:avoid}
}
@media (max-width:880px){
  .cover h1{font-size:40px}.sec h2{font-size:25px}
  .hero-band{flex-direction:column;align-items:flex-start}
  .numcards,.mods{grid-template-columns:1fr}.solpanel{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}.metric+.metric{border-left:0}
  .runhead{padding:12px 24px}.qcols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.doc{animation:none}.ast-spin{animation:none}}


/* ====================  EDITOR / LAYOUT  ==================== */
.layout{display:grid;grid-template-columns:388px 1fr;height:calc(100vh - 47px)}
.editor{overflow-y:auto;background:#fff;border-right:1px solid var(--line)}
.preview{overflow-y:auto;background:var(--app);padding:26px 20px 90px;display:flex;justify-content:center;align-items:flex-start}
.preview .doc{margin:0}

details.grp{border-bottom:1px solid var(--line)}
details.grp>summary{padding:15px 18px;font-family:var(--fd);font-weight:700;font-size:13px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;color:var(--ink)}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .ico{width:12px;height:12px;color:var(--teal)}
details.grp>summary .cnt{margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--muted);font-weight:400}
details.grp[open]>summary{color:var(--blue)}
.gbody{padding:2px 18px 18px}
.fld{margin-bottom:12px}
.fld label{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input,.fld textarea{width:100%;font-family:var(--fb);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);background:#fff}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:54px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;background:var(--soft)}
.item .ihd{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.item .ihd b{font-family:var(--fm);font-size:10.5px;color:var(--blue);letter-spacing:.05em}
.rm{color:#E15B68;cursor:pointer;font-size:11px;font-weight:700;border:0;background:none;font-family:var(--fb)}
.add{width:100%;border:1px dashed #B9C6EF;color:var(--blue);background:var(--tint);border-radius:9px;padding:9px;cursor:pointer;font-weight:700;font-size:12px;font-family:var(--fb)}
.upl{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:#fff}
.upl input{display:none}
.tpl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:12.5px}
.tpl .ta{display:flex;gap:6px}
.tpl button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-weight:600}
.tpl button.load{color:var(--blue);border-color:#B9C6EF}
.saverow{display:flex;gap:8px;margin-bottom:12px}
.saverow input{flex:1;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.saverow button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}

@media print{
  .appbar,.hint,.editor,.no-print{display:none!important}
  .layout{display:block!important;height:auto!important}
  .preview{overflow:visible!important;padding:0!important;display:block!important}
  .doc{box-shadow:none;border-radius:0;width:100%}
  .ast-spin{animation:none}
}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr;height:auto}
  .editor{border-right:0;border-bottom:1px solid var(--line)}
}

/* ====================  UX ANÁLISIS + ROBUSTEZ  ==================== */
.ctx{min-height:150px}
.analyze{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grad-blue);color:#fff;border:0;border-radius:10px;padding:11px;font-family:var(--fd);font-weight:700;font-size:13px;cursor:pointer;margin-top:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.analyze .ico{color:#fff}
.analyze:hover{filter:brightness(1.06)}
.logoprev{display:flex;align-items:center;gap:12px;margin-top:10px}
.logoprev img{max-height:48px;max-width:150px;width:auto;height:auto;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--blue);border:1px solid #cdd8f7;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600}
.chip button{border:0;background:none;color:var(--blue);cursor:pointer;font-size:14px;line-height:1;padding:0}
.finos{padding:16px 18px 6px;font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* logo del cliente en los documentos: proporción intacta, nunca deformado */
.clogo-real{width:120px;height:56px;display:flex;align-items:center;justify-content:flex-end;overflow:hidden}
.clogo-real img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}

/* robustez ante textos largos */
.doc h1,.doc h2,.doc h3,.doc h4,.doc p,.doc td,.doc li,.doc .v,.doc .t,.doc .lb{overflow-wrap:break-word;word-break:normal}
.numcards>*,.mods>*,.metrics>*,.qcols>*,.solpanel>*,.hero-band>*,.cover .meta>*{min-width:0}
.ncard{height:auto}
.hero-band .lead2{min-width:0}
.cover .meta{flex-wrap:wrap;row-gap:16px}
.qmeta{flex-wrap:wrap;row-gap:12px}
.closebox .foot{position:static;margin-top:26px;right:auto;bottom:auto}

@media print{
  .ncard,.mod,.callout,.hero-band,.solpanel,.keybox,.rp,.metric,.item,.tpl,.qfoot,.closebox,.cover .meta,.qmeta,table.cot tr,.impact{break-inside:avoid}
  thead{display:table-header-group}
  .runhead,.sec h2,.cover h1,.q-eyebrow{break-after:avoid}
  .doc{width:100%!important}
}


/* logo del cliente 40% más grande, proporción intacta */
.clogo-real{width:168px !important;height:78px !important}
.cover .clogo{width:168px;height:78px}
.redact{background:var(--ink) !important;margin-top:10px}
/* límites de longitud: las tarjetas no crecen sin control */
.ncard p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mod p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rp p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.solpanel p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.benefgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;position:relative;z-index:1;margin-top:6px}
.benef-card{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 16px;font-size:13px;color:#EAF0FF;min-width:0;line-height:1.4}
.benef-card .ico{color:var(--teal);flex:none;margin-top:2px}

/* modo embebido dentro de Konekt Sales */
body.embed .appbar,body.embed .hint{display:none!important}
body.embed .layout{height:100vh}


/* ===== Integración del generador en Konekt Sales (sin rediseñar el documento) ===== */
.gen-toolbar{display:flex;align-items:center;gap:10px;padding:0 0 14px}
.gen-toolbar .spacer{flex:1}
.gen-switch{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px}
.gen-switch button{border:0;background:transparent;font-family:var(--fb);font-weight:600;font-size:13px;color:var(--muted);padding:8px 15px;border-radius:8px;cursor:pointer}
.gen-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,17,32,.1)}
.content .layout.genlayout{height:calc(100vh - 66px - 26px - 58px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.content .layout.genlayout .editor{border-right:1px solid var(--line)}
@media print{
  .side,.topbar,.gen-toolbar,.breadcrumb{display:none!important}

function go(view){
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===view));
  setTitle(view); const el=document.getElementById("view");
  if(view==="dashboard")el.innerHTML=renderDashboard();
  else if(view==="midia")el.innerHTML=renderMiDia();
  else if(view==="pipeline")el.innerHTML=renderPipeline();
  else if(view==="calendario")el.innerHTML=renderCalendario();
  else if(view==="clientes")el.innerHTML=renderClientes();

  else if(view==="propuestas"){openGenerador("prop",null);return;}

   ["Leads nuevos",nuevos,"esta semana","M12 5v14M5 12h14"],

  const tks=tareas.map((t,i)=>taskRow(t,i)).join("");

     <div class="avatar" style="border-radius:9px;width:32px;height:32px;font-size:12px">${initials(l.nombre)}</div>

     <span class="stagechip" style="background:${stageOf(l.etapa).color}">${stageOf(l.etapa).label}</span></div>`).join("");

   <div class="grid statgrid" style="margin-bottom:22px">${st}</div>
   <div class="cols2">
     <div class="card">
       <div class="sech"><span class="kicker">${A(12)} Hoy tienes que hacer</span><div class="spacer"></div><span class="link" onclick="go('midia')">Ver Mi día →</span></div>

function taskRow(t,i){

  return `<div class="task ${t.done?'done':''}">
    <div class="chk" onclick="toggleTask(${i})"><svg class="ico" width="13" height="13" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>

    <span class="pill ${t.tipo}">${pills[t.tipo]}</span>
    ${t.lead?`<span class="link" style="font-size:12px" onclick="openLead(${t.lead})">Abrir</span>`:''}
  </div>`;
}
function toggleTask(i){tareas[i].done=!tareas[i].done;const done=tareas.filter(t=>t.done).length;document.getElementById("nav-midia").textContent=(tareas.length-done);

/* =================  PIPELINE (KANBAN)  ================= */
function renderPipeline(){
  const cols=STAGES.map(s=>{
    const items=leads.filter(l=>l.etapa===s.id);
    const val=items.reduce((a,l)=>a+l.valor,0);
    const cards=items.map(l=>kcard(l)).join("")||`<div style="font-size:11px;color:var(--muted);padding:10px;text-align:center">—</div>`;
    return `<div class="kcol" ondragover="allow(event)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${s.id}')">
      <div class="kh"><span class="dot" style="background:${s.color}"></span>${s.label}<span class="n">${items.length}${val?' · '+money(val):''}</span></div>
      ${cards}</div>`;
  }).join("");
  return `<div class="kanban">${cols}</div>`;
}
function kcard(l){
  return `<div class="kcard" draggable="true" ondragstart="drag(event,${l.id})" ondragend="this.classList.remove('drag')" onclick="openLead(${l.id})">
    <div class="co">${esc(l.empresa)}</div><div class="nm">${esc(l.nombre)}</div>
    <div class="sv">${esc(l.servicio)}</div>
    <div class="row"><span class="val">${money(l.valor)}</span><span style="color:var(--muted)">${l.prob}%</span></div>
    <div class="meta"><span class="dotint int-${l.interes}"></span>${l.interes}<span style="margin-left:auto">${esc(l.vendedor)} · ${esc(l.seguimiento)}</span></div>
  </div>`;
}
let dragId=null;
function drag(e,id){dragId=id;e.target.classList.add('drag');e.dataTransfer.effectAllowed="move";}
function allow(e){e.preventDefault();e.currentTarget.classList.add('dragover');}
function drop(e,stage){e.preventDefault();e.currentTarget.classList.remove('dragover');
  const l=leads.find(x=>x.id===dragId);if(l){l.etapa=stage;if(stage==="ganado"&&!l.cliente)l.cliente=defCliente(l);}go('pipeline');}
function defCliente(l){const iva=l.valor*0.16,tot=l.valor+iva;return {fechaCierre:new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}),servicio:l.servicio,precio:l.valor,descuento:0,iva:true,formaPago:"50% / 30% / 20%",inicio:"Por definir",entrega:"Por definir",estado:"Por iniciar",pagos:[{n:"Pago 1",pct:50,monto:Math.round(tot*.5),estado:"pend"},{n:"Pago 2",pct:30,monto:Math.round(tot*.3),estado:"pend"},{n:"Pago 3",pct:20,monto:tot-Math.round(tot*.5)-Math.round(tot*.3),estado:"pend"}]};}

/* ===============  RENDER · COTIZACIÓN  =============== */
function buildQuote(s){
  const now=new Date();
  const venc=new Date(now.getTime()+ (s.meta.vencDias||30)*864e5);
  let sub=0; s.cot.conceptos.forEach(c=>sub+=Number(c.p)||0);
  const iva=sub*0.16, tot=sub+iva;
  const pagos=(s.meta.esquemaPagos&&s.meta.esquemaPagos.length)?s.meta.esquemaPagos:[];
  let etapasHTML="";
  if(pagos.length){
    let acc=0;const cols=pagos.map((p,idx)=>{const amt=idx===pagos.length-1?(tot-acc):Math.round(tot*(Number(p.pct)||0)/100);acc+=amt;return{pct:Number(p.pct)||0,c:p.c||"",amt};});
    etapasHTML=`<div class="bt">Esquema de pagos</div>
      <table class="etapas"><thead><tr>${cols.map(c=>`<th>${c.pct}%${c.c?(" · "+esc(c.c)):""}</th>`).join("")}</tr></thead>
      <tbody><tr>${cols.map(c=>`<td>${money(c.amt)}</td>`).join("")}</tr></tbody></table>`;
  } else {
    etapasHTML=`<div class="bt">Esquema de pagos</div><p style="font-size:11.5px;color:#4A4F60;line-height:1.6">${esc(s.meta.formaPago||"No especificado")}</p>`;
  }
  const rows=s.cot.conceptos.map(c=>`<tr><td>${esc(c.d)}</td><td class="num">${money(c.p)}</td></tr>`).join("");
  const terms=s.cot.terminos.map(t=>`<li>${esc(t)}</li>`).join("");
  const clientLine = s.cliente.logo
    ? `<img src="${s.cliente.logo}" class="clientlogo-img" style="height:auto;max-height:62px;max-width:200px;width:auto;object-fit:contain;display:inline-block;margin-bottom:6px"><br>`+
      `<b>${esc(s.cliente.empresa)}</b>${esc(s.cliente.direccion)}<br>${esc(s.cliente.ciudad)}<br>${esc(s.cliente.pais)}`

/* ===============  RENDER · FORMULARIO  =============== */
function tf(label,path){return `<div class="fld"><label>${label}</label><input value="${esc(P(path))}" oninput="setP('${path}',this.value);paintPreview()"></div>`;}
function ta(label,path){return `<div class="fld"><label>${label}</label><textarea oninput="setP('${path}',this.value);paintPreview()">${esc(P(path))}</textarea></div>`;}
function nf(label,path){return `<div class="fld"><label>${label}</label><input type="number" value="${P(path)}" oninput="setNum('${path}',this.value);paintPreview()"></div>`;}

function buildForm(s){
  const modItems=s.prop.modulos.map((m,i)=>`<div class="item"><div class="ihd"><b>MÓDULO ${i+1}</b><button class="rm" onclick="rmFrom('prop.modulos',${i})">Quitar</button></div>
    ${tf("Nombre",'prop.modulos.'+i+'.n')}${ta("Descripción",'prop.modulos.'+i+'.d')}${tf("Etiqueta / impacto",'prop.modulos.'+i+'.tag')}</div>`).join("");
  const retoItems=s.prop.retos.map((r,i)=>`<div class="item"><div class="ihd"><b>RETO ${i+1}</b><button class="rm" onclick="rmFrom('prop.retos',${i})">Quitar</button></div>
    ${tf("Título",'prop.retos.'+i+'.t')}${ta("Descripción",'prop.retos.'+i+'.d')}</div>`).join("");
  const beneItems=s.prop.beneficios.map((b,i)=>`<div class="item"><div class="ihd"><b>BENEFICIO ${i+1}</b><button class="rm" onclick="rmFrom('prop.beneficios',${i})">Quitar</button></div>
    ${tf("Texto",'prop.beneficios.'+i)}</div>`).join("");
  const metItems=s.prop.metricas.map((m,i)=>`<div class="item"><div class="ihd"><b>MÉTRICA ${i+1}</b><button class="rm" onclick="rmFrom('prop.metricas',${i})">Quitar</button></div>
    <div class="row2">${tf("Cifra",'prop.metricas.'+i+'.big')}${tf("Etiqueta",'prop.metricas.'+i+'.lb')}</div>${tf("Detalle",'prop.metricas.'+i+'.ds')}</div>`).join("");
  const faseItems=s.prop.fases.map((f,i)=>`<div class="item"><div class="ihd"><b>FASE ${i+1}</b><button class="rm" onclick="rmFrom('prop.fases',${i})">Quitar</button></div>
    ${tf("Etiqueta",'prop.fases.'+i+'.e')}${tf("Título",'prop.fases.'+i+'.t')}${ta("Descripción",'prop.fases.'+i+'.d')}<div class="row2">${tf("Duración",'prop.fases.'+i+'.dur')}${tf("Unidad",'prop.fases.'+i+'.u')}</div></div>`).join("");
  const cptItems=s.cot.conceptos.map((c,i)=>`<div class="item"><div class="ihd"><b>CONCEPTO ${i+1}</b><button class="rm" onclick="rmFrom('cot.conceptos',${i})">Quitar</button></div>
    ${tf("Servicio / concepto",'cot.conceptos.'+i+'.d')}${nf("Precio (MXN)",'cot.conceptos.'+i+'.p')}</div>`).join("");
  const termItems=s.cot.terminos.map((t,i)=>`<div class="item"><div class="ihd"><b>${String.fromCharCode(97+i)})</b><button class="rm" onclick="rmFrom('cot.terminos',${i})">Quitar</button></div>
    ${tf("Término",'cot.terminos.'+i)}</div>`).join("");
  const chips=s.prop.modulos.map((m,i)=>`<span class="chip">${esc(m.n)}<button onclick="rmFrom('prop.modulos',${i})" title="Quitar">×</button></span>`).join("");
  let _sub=0;s.cot.conceptos.forEach(c=>_sub+=Number(c.p)||0);

/* ===============  PINTAR  =============== */
function paintPreview(){document.getElementById("doc-prop").innerHTML=buildProp(state);document.getElementById("doc-quote").innerHTML=buildQuote(state);}
function paintForm(){document.getElementById("editor").innerHTML=buildForm(state);}

/* ===============  LISTAS (agregar/quitar)  =============== */
function addTo(path,item){P(path).push(clone(item));paintForm();paintPreview();}
function rmFrom(path,i){P(path).splice(i,1);paintForm();paintPreview();}

/* ===============  LOGO CLIENTE  =============== */
function uploadLogo(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{state.cliente.logo=e.target.result;paintPreview();paintForm();};r.readAsDataURL(f);}

/* ===============  ANÁLISIS DE TEXTO (lenguaje natural)  =============== */
function cap(x){x=String(x||"").trim();return x?x.charAt(0).toUpperCase()+x.slice(1):x;}
function listJoin(a){a=a.filter(Boolean);if(a.length<=1)return a.join("");return a.slice(0,-1).join(", ")+" y "+a[a.length-1];}
function retoTitle(p){p=p.toLowerCase();
  if(/excel|manual|a mano|cuaderno|hoja/.test(p))return "Control manual";
  if(/inventario|material|stock|existenc/.test(p))return "Inventario sin control";
  if(/producci|órden|orden/.test(p))return "Producción sin seguimiento";
  if(/entrega|tiempo|retras|tarda/.test(p))return "Tiempos de entrega";
  if(/no s[eé]|saber|visib|dif[ií]cil|cu[aá]nto/.test(p))return "Falta de visibilidad";
  if(/pierde|merma|p[eé]rdida/.test(p))return "Pérdidas invisibles";
  return "Reto operativo";}

function parseContexto(txt){
  const t=" "+txt.toLowerCase().replace(/\s+/g," ")+" ";
  const r={giro:"",problemas:[],modulos:[],integraciones:[],precio:null,formaPago:"",tiempo:"",vencDias:null};
  let m=txt.replace(/\s/g,"").match(/\$([\d.,]+)/);
  if(m){let n=m[1].replace(/[.,]/g,"");if(n)r.precio=Number(n);}
  if(r.precio==null){let mm=t.match(/(\d+(?:\.\d+)?)\s*mil/);if(mm)r.precio=Math.round(parseFloat(mm[1])*1000);}
  if(r.precio==null){let mk=t.match(/(\d[\d,\.]{2,})\s*(pesos|mxn)/);if(mk){let n=mk[1].replace(/[^\d]/g,"");if(n)r.precio=Number(n);}}
  let ant=t.match(/(\d{1,3})\s*%\s*(de\s*)?anticipo/);
  if(ant){const a=Number(ant[1]);r.formaPago=a+"% anticipo, "+(100-a)+"% contra entrega";}
  else if(/una sola exhibici/.test(t))r.formaPago="Pago en una sola exhibición";
  else if(/anticipo/.test(t))r.formaPago="Anticipo y liquidación contra entrega";
  let tm=t.match(/(\d+)\s*(meses|mes|semanas|semana|d[ií]as|d[ií]a)/);
  if(tm){let u=tm[2];r.tiempo=tm[1]+" "+u.replace("dia","día");}
  let vg=t.match(/vigencia[^\d]{0,14}(\d+)\s*d[ií]as/)||t.match(/(\d+)\s*d[ií]as\s*de\s*vigencia/);
  if(vg)r.vencDias=Number(vg[1]);
  let g=txt.match(/\bes (?:una|un|la|el)\s+([^.,;\n]+)/i);
  if(g)r.giro=g[1].trim().replace(/\s+que\b[\s\S]*/i,"").replace(/\s+(actualmente|hoy)\b[\s\S]*/i,"").trim();
  if(!r.giro){const giros=["fábrica","mueblería","tienda","restaurante","boutique","cafetería","distribuidora","inmobiliaria","clínica","consultorio","taller","agencia","ferretería","farmacia","hotel","gimnasio","escuela"];
    for(const x of giros){if(t.includes(x)){const rx=new RegExp(x+"\\s+de\\s+([^.,;\\n]{1,28})","i");const mm=txt.match(rx);r.giro=mm?(x+" de "+mm[1].trim()):x;break;}}}
  const sentences=txt.split(/[.\n;]+/).map(x=>x.trim()).filter(Boolean);
  sentences.forEach(sen=>{if(/problema|no s[eé]|no puede|dif[ií]cil|manual|excel|sin control|se pierde|a mano|retras|no tiene|cu[aá]nto/i.test(sen))r.problemas.push(sen);});
  const dict=[
    [/dashboard|tablero/, {n:"Dashboard de negocio",d:"Ver el rendimiento del negocio en tiempo real, desde el celular.",tag:"Decisiones con datos"}],
    [/inventario|existenc|stock/, {n:"Inventario inteligente",d:"Control de existencias, descuento por venta y alertas de faltantes.",tag:"Menos merma"}],
    [/producci|órden|orden de/, {n:"Control de producción",d:"Órdenes de producción, materiales y avance por etapa.",tag:"Producción bajo control"}],
    [/pedidos?/, {n:"Gestión de pedidos",d:"Registro y seguimiento de pedidos de principio a fin.",tag:"Pedidos ordenados"}],
    [/tiempos? de entrega|entregas?/, {n:"Tiempos de entrega",d:"Seguimiento de fechas y estatus de cada entrega.",tag:"Cumplir a tiempo"}],
    [/alertas?/, {n:"Alertas inteligentes",d:"Avisos automáticos de faltantes, retrasos y puntos críticos.",tag:"A tiempo, siempre"}],
    [/crm|clientes/, {n:"CRM de clientes",d:"Saber quién compra, qué se lleva y cada cuándo.",tag:"Base para vender mejor"}],
    [/whatsapp/, {n:"WhatsApp automatizado",d:"Atender y tomar pedidos sin estar pegado al teléfono.",tag:"Respuesta inmediata"}],
    [/p[aá]gina web|sitio web|landing/, {n:"Página web profesional",d:"Presencia digital y un lugar serio para mandar a los clientes.",tag:"Presencia y pedidos"}],
    [/\bpos\b|caja|punto de venta/, {n:"Caja / POS",d:"Punto de venta conectado a la base de datos.",tag:"Ventas registradas"}],
    [/lealtad|puntos/, {n:"Programa de lealtad",d:"Puntos y recompensas para que el cliente vuelva.",tag:"Más recompra"}],
    [/marketing/, {n:"Marketing automatizado",d:"Campañas y recuperación de clientes sin trabajo manual.",tag:"Ventas recurrentes"}],
    [/finan|utilidad|margen/, {n:"Dashboard financiero",d:"Rentabilidad y flujo real del negocio.",tag:"Margen real"}]
  ];
  const seen=new Set();
  for(const pair of dict){if(pair[0].test(t)&&!seen.has(pair[1].n)){seen.add(pair[1].n);r.modulos.push(Object.assign({},pair[1]));}}
  ["excel","shopify","woocommerce","sat","stripe","instagram","meta","whatsapp","sap","contpaqi","quickbooks","zebra"].forEach(x=>{if(t.includes(x))r.integraciones.push(x==="sat"?"SAT":cap(x));});
  return r;
}

function applyParsed(r){
  const s=state;
  if(r.giro)s.cliente.giro=cap(r.giro);
  if(r.problemas.length)s.prop.retos=r.problemas.slice(0,3).map(p=>({t:retoTitle(p),d:cap(p)+"."}));
  if(r.modulos.length)s.prop.modulos=r.modulos.map(m=>clone(m));
  const names=(r.modulos.length?r.modulos:s.prop.modulos).map(m=>m.n);
  s.prop.solT="Un sistema a la medida, todo conectado";
  s.prop.solD="Konekt propone un sistema que integra "+listJoin(names.map(n=>n.toLowerCase()))+" en un solo lugar"+(s.cliente.giro?(" para "+s.cliente.giro.toLowerCase()):"")+(r.integraciones.length?(", conectado con "+listJoin(r.integraciones)):"")+".";
  if(s.cliente.giro){s.prop.tituloB="tu negocio";s.prop.lead="Konekt propone un sistema a la medida para "+s.cliente.giro.toLowerCase()+", que ordena la operación y da control en tiempo real.";s.prop.heroT="Un solo sistema para "+(names.length?listJoin(names.slice(0,3).map(n=>n.toLowerCase())):"toda la operación")+".";}
  if(r.precio!=null)s.cot.conceptos=[{d:"Desarrollo e implementación del sistema"+(names.length?" ("+names.join(", ")+")":""),p:r.precio}];
  if(r.formaPago)s.meta.formaPago=r.formaPago;
  if(r.tiempo)s.meta.tiempo=r.tiempo;
  if(r.vencDias){s.meta.vencDias=r.vencDias;s.cot.vigencia="Válida por "+r.vencDias+" días a partir de la fecha de emisión.";}
}

const API_BASE=(window.KONEKT_API_BASE||"");
function val0(x){return (x!=null && x!=="No especificado" && x!=="")?x:null;}
function clampStr(s,max){s=String(s==null?"":s).trim();if(s.length<=max)return s;return s.slice(0,max-1).replace(/\s+\S*$/,"")+"…";}

async function analizar(){
  const el=document.getElementById("ctx");const txt=((el&&el.value)||state.contexto||"").trim();state.contexto=txt;
  if(!txt){state.aiStatus="Escribe primero el contexto arriba.";paintForm();return;}
  state.aiStatus="Analizando con Claude…";paintForm();
  try{
    const res=await fetch(API_BASE+"/api/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto:txt})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||("HTTP "+res.status));}
    const d=await res.json();
    state.extraccion=d;mapExtract(d);state.analizado=true;
    const det=[];if(val0(d.empresa))det.push("empresa");if(val0(d.contacto))det.push("contacto");if(Array.isArray(d.modulos)&&d.modulos.length)det.push(d.modulos.length+" módulos");if(d.precio!=null)det.push("precio");if(Array.isArray(d.esquema_pagos)&&d.esquema_pagos.length)det.push("esquema de pagos");
    state.aiStatus="Extracción lista · "+(det.join(", ")||"revisa los campos")+". Corrige lo necesario y pulsa \"Redactar con IA\".";
    paintForm();paintPreview();
  }catch(err){
    state.aiStatus="No pude conectar con la IA ("+err.message+"). Inicia el backend (node server.js) y abre http://localhost:3000";
    paintForm();
  }
}

function mapExtract(d){
  const s=state;
  if(val0(d.empresa))s.cliente.empresa=d.empresa;
  if(val0(d.contacto))s.cliente.contacto=d.contacto;
  if(val0(d.puesto))s.cliente.puesto=d.puesto;
  if(val0(d.telefono))s.cliente.tel=d.telefono;
  if(val0(d.correo))s.cliente.correo=d.correo;
  if(val0(d.giro))s.cliente.giro=d.giro;
  if(val0(d.ubicacion))s.cliente.ubicacion=d.ubicacion;
  if(val0(d.descripcion_negocio))s.cliente.descripcion=d.descripcion_negocio;
  if(d.precio!=null && !isNaN(Number(d.precio))){
    const nm=(Array.isArray(d.modulos)&&d.modulos.length)?(" ("+d.modulos.map(m=>m.nombre||m).join(", ")+")"):"";
    s.cot.conceptos=[{d:"Desarrollo e implementación del sistema"+nm,p:Number(d.precio)}];
  }
  if(Array.isArray(d.esquema_pagos)&&d.esquema_pagos.length){
    s.meta.esquemaPagos=d.esquema_pagos.map(x=>({pct:Number(x.porcentaje)||0,c:val0(x.concepto)||""}));
    s.meta.formaPago=s.meta.esquemaPagos.map(x=>x.pct+"%"+(x.c?(" "+x.c):"")).join(" / ");
  } else { s.meta.esquemaPagos=[]; if(val0(d.esquema_pagos))s.meta.formaPago=String(d.esquema_pagos); }
  if(val0(d.tiempo_implementacion))s.meta.tiempo=d.tiempo_implementacion;
  if(val0(d.vigencia)){s.cot.vigencia=d.vigencia;const md=String(d.vigencia).match(/(\d+)\s*d[ií]a/);if(md)s.meta.vencDias=Number(md[1]);}
  if(typeof d.iva==="boolean")s.meta.iva=d.iva;
  if(Array.isArray(d.modulos)&&d.modulos.length){
    s.prop.modulos=d.modulos.map(m=>({n:clampStr(m.nombre||String(m),40),d:clampStr(Array.isArray(m.funcionalidades)?m.funcionalidades.join(", "):(m.descripcion||""),110),tag:""}));
  }
  s.extraIntegraciones=Array.isArray(d.integraciones)?d.integraciones.filter(x=>val0(x)):[];
  if(Array.isArray(d.problematica)&&d.problematica.length){
    s.prop.retos=d.problematica.slice(0,4).map((p,i)=>({t:"Punto "+String(i+1).padStart(2,"0"),d:clampStr(p,150)}));
  }
  if(val0(d.solucion)){s.prop.solT="Nuestra solución";s.prop.solD=clampStr(d.solucion,300);}
  s.prop.metricas=[];
}

async function redactar(){
  if(!state.analizado){state.aiStatus="Primero analiza el texto con IA.";paintForm();return;}
  state.aiStatus="Redactando propuesta con Claude…";paintForm();
  const datos={
    empresa:state.cliente.empresa,giro:state.cliente.giro,descripcion:state.cliente.descripcion,
    problematica:state.prop.retos.map(r=>r.d),
    solucion:state.prop.solD,
    modulos:state.prop.modulos.map(m=>({nombre:m.n,funcionalidades:m.d})),
    integraciones:state.extraIntegraciones||[],
    precio:(state.cot.conceptos[0]||{}).p||null,
    esquema_pagos:state.meta.esquemaPagos,tiempo:state.meta.tiempo,vigencia:state.cot.vigencia,
    metricas_proporcionadas:(state.extraccion&&state.extraccion.metricas_proporcionadas)||[]
  };
  try{
    const res=await fetch(API_BASE+"/api/redactar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({datos})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||("HTTP "+res.status));}
    const r=await res.json();mapRedact(r);
    state.aiStatus="Propuesta redactada por Claude. Ajusta lo que quieras en \"Ajustes finos\".";
    paintForm();paintPreview();showDoc("prop");
  }catch(err){state.aiStatus="No pude redactar ("+err.message+"). ¿Está corriendo el backend?";paintForm();}
}

function mapRedact(r){
  const s=state;
  if(Array.isArray(r.reto)&&r.reto.length)s.prop.retos=r.reto.slice(0,4).map(x=>({t:clampStr(x.titulo||"",44),d:clampStr(x.desc||"",150)}));
  if(r.solucion){s.prop.solT=clampStr(r.solucion.titulo||"Nuestra solución",60);s.prop.solD=clampStr(r.solucion.desc||"",320);}
  if(Array.isArray(r.modulos)&&r.modulos.length)s.prop.modulos=r.modulos.map(m=>({n:clampStr(m.nombre||"",40),d:clampStr(m.desc||"",120),tag:clampStr(m.tag||"",28)}));
  if(Array.isArray(r.beneficios))s.prop.beneficios=r.beneficios.slice(0,6).map(b=>clampStr(b,72));
  s.prop.metricas=Array.isArray(r.metricas)?r.metricas.slice(0,4).map(m=>({big:clampStr(m.big||"",8),lb:clampStr(m.lb||"",22),ds:clampStr(m.ds||"",26)})):[];
  if(r.titulo){if(val0(r.titulo.a))s.prop.tituloA=clampStr(r.titulo.a,28);if(val0(r.titulo.b))s.prop.tituloB=clampStr(r.titulo.b,20);}
  if(val0(r.lead))s.prop.lead=clampStr(r.lead,190);
  if(val0(r.heroT))s.prop.heroT=clampStr(r.heroT,90);
}

function setPrecio(v){if(!state.cot.conceptos.length)state.cot.conceptos.push({d:"Desarrollo del sistema",p:0});state.cot.conceptos[0].p=Number(v||0);
  let sub=0;state.cot.conceptos.forEach(c=>sub+=Number(c.p)||0);const el=document.getElementById("precio-total");if(el)el.textContent="Total con IVA: "+money(sub*1.16);paintPreview();}
function setVigenciaDias(v){state.meta.vencDias=Number(v||0);state.cot.vigencia="Válida por "+(v||0)+" días a partir de la fecha de emisión.";paintPreview();}

/* ===============  ALMACENAMIENTO (capa aislada)  =============== */
const storage={
  KEY:"konekt_plantillas_v1",
  all(){try{return JSON.parse(localStorage.getItem(this.KEY)||"{}")}catch(e){return{}}},
  save(n,d){const a=this.all();a[n]=d;localStorage.setItem(this.KEY,JSON.stringify(a));},
  load(n){return this.all()[n];},
  remove(n){const a=this.all();delete a[n];localStorage.setItem(this.KEY,JSON.stringify(a));},
  list(){return Object.keys(this.all());}
};
function saveTpl(){const el=document.getElementById("tpl-name");const n=(el.value||"").trim();if(!n){el.focus();return;}storage.save(n,clone(state));paintForm();}
function loadTpl(n){const d=storage.load(n);if(d){state=clone(d);paintForm();paintPreview();}}
function delTpl(n){if(confirm("¿Borrar la plantilla \""+n+"\"?")){storage.remove(n);paintForm();}}
function resetAll(){if(confirm("¿Limpiar todo y volver al ejemplo?")){state=baseState();paintForm();paintPreview();}}

/* ===============  DOCS  =============== */




/* ======  GENERADOR NATIVO DENTRO DE KONEKT SALES (diseño original intacto)  ====== */
function showDoc(w){const dp=document.getElementById("doc-prop"),dq=document.getElementById("doc-quote");if(!dp||!dq)return;const isP=w==="prop";dp.classList.toggle("hidden",!isP);dq.classList.toggle("hidden",isP);genDoc=w;const tp=document.getElementById("gtab-prop"),tq=document.getElementById("gtab-quote");if(tp)tp.classList.toggle("active",isP);if(tq)tq.classList.toggle("active",!isP);}
function renderGenerador(){const back=genOrigin!=null?`<button class="btn" onclick="openLead(${genOrigin})">\u2190 Volver al prospecto</button>`:"";
 return `<div class="gen-toolbar">${back}<div class="gen-switch"><button id="gtab-prop" class="${genDoc==='prop'?'active':''}" onclick="showDoc('prop')">Propuesta comercial</button><button id="gtab-quote" class="${genDoc==='quote'?'active':''}" onclick="showDoc('quote')">Cotización</button></div><div class="spacer"></div><button class="btn" onclick="resetAll()">Limpiar</button><button class="btn primary" onclick="exportarPDF()">Exportar a PDF</button></div>
 <div class="layout genlayout"><aside class="editor" id="editor"></aside><section class="preview"><article id="doc-prop" class="doc"></article><article id="doc-quote" class="doc quote hidden"></article></section></div>`;}
function openGenerador(doc,origin){genDoc=doc||genDoc||"prop";genOrigin=(origin!=null)?origin:null;
 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===(genDoc==='quote'?'cotizaciones':'propuestas')));
 setTitle(genDoc==='quote'?'cotizaciones':'propuestas');
 const el=document.getElementById("view");el.innerHTML=renderGenerador();el.scrollTop=0;initGenerador();}
function initGenerador(){paintForm();paintPreview();showDoc(genDoc);}
function exportarPDF(){window.print();}

</script>
