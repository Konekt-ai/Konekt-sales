# Konekt Sales · nginx como proxy inverso con HTTPS
#
# Sirve igual para el camino con Docker y para el de systemd: en los dos casos
# la aplicación escucha en 127.0.0.1:3000 y nginx es lo único expuesto.
#
# Instalar:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/konekt-sales
#   sudo ln -s /etc/nginx/sites-available/konekt-sales /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado (después de que el dominio ya apunte a este servidor):
#   sudo certbot --nginx -d ventas.konekt.mx
#   Certbot rellena solo las líneas de ssl_certificate de abajo.
#
# Cambia ventas.konekt.mx por tu dominio real en los tres lugares donde aparece.

# ---- HTTP: solo redirige a HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name ventas.konekt.mx;

    # Certbot necesita este camino en claro para renovar.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ventas.konekt.mx;

    # Las rellena certbot:
    # ssl_certificate     /etc/letsencrypt/live/ventas.konekt.mx/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ventas.konekt.mx/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # El logo pesa 107 KB: sin compresion el primer cargado se siente lento
    # en conexiones malas.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Las propuestas largas viajan completas en el cuerpo de la petición.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Sin esta cabecera, el servidor ve la IP de nginx y el límite de uso
        # trata a todo el equipo como un solo usuario. Va de la mano con
        # TRUST_PROXY=1 en el .env.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host             $host;

        # Redactar una propuesta con IA puede tardar bastante más que el
        # minuto que nginx espera por omisión.
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # El chequeo de salud no necesita quedar en el log de accesos.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }
}
