/* ===============  ANÁLISIS DE TEXTO (lenguaje natural)  =============== */
function cap(x){x=String(x||"").trim();return x?x.charAt(0).toUpperCase()+x.slice(1):x;}
function listJoin(a){a=a.filter(Boolean);if(a.length<=1)return a.join("");return a.slice(0,-1).join(", ")+" y "+a[a.length-1];}
function retoTitle(p){p=p.toLowerCase();
  if(/excel|manual|a mano|cuaderno|hoja/.test(p))return "Control manual";
  if(/inventario|material|stock|existenc/.test(p))return "Inventario sin control";
  if(/producci|órden|orden/.test(p))return "Producción sin seguimiento";
  if(/entrega|tiempo|retras|tarda/.test(p))return "Tiempos de entrega";
  if(/no s[eé]|saber|visib|dif[ií]cil|cu[aá]nto/.test(p))return "Falta de visibilidad";
  if(/pierde|merma|p[eé]rdida/.test(p))return "Pérdidas invisibles";
  return "Reto operativo";}

function parseContexto(txt){
  const t=" "+txt.toLowerCase().replace(/\s+/g," ")+" ";
  const r={giro:"",problemas:[],modulos:[],integraciones:[],precio:null,formaPago:"",tiempo:"",vencDias:null};
  let m=txt.replace(/\s/g,"").match(/\$([\d.,]+)/);
  if(m){let n=m[1].replace(/[.,]/g,"");if(n)r.precio=Number(n);}
  if(r.precio==null){let mm=t.match(/(\d+(?:\.\d+)?)\s*mil/);if(mm)r.precio=Math.round(parseFloat(mm[1])*1000);}
  if(r.precio==null){let mk=t.match(/(\d[\d,\.]{2,})\s*(pesos|mxn)/);if(mk){let n=mk[1].replace(/[^\d]/g,"");if(n)r.precio=Number(n);}}
  let ant=t.match(/(\d{1,3})\s*%\s*(de\s*)?anticipo/);
  if(ant){const a=Number(ant[1]);r.formaPago=a+"% anticipo, "+(100-a)+"% contra entrega";}
  else if(/una sola exhibici/.test(t))r.formaPago="Pago en una sola exhibición";
  else if(/anticipo/.test(t))r.formaPago="Anticipo y liquidación contra entrega";
  let tm=t.match(/(\d+)\s*(meses|mes|semanas|semana|d[ií]as|d[ií]a)/);
  if(tm){let u=tm[2];r.tiempo=tm[1]+" "+u.replace("dia","día");}
  let vg=t.match(/vigencia[^\d]{0,14}(\d+)\s*d[ií]as/)||t.match(/(\d+)\s*d[ií]as\s*de\s*vigencia/);
  if(vg)r.vencDias=Number(vg[1]);
  let g=txt.match(/\bes (?:una|un|la|el)\s+([^.,;\n]+)/i);
  if(g)r.giro=g[1].trim().replace(/\s+que\b[\s\S]*/i,"").replace(/\s+(actualmente|hoy)\b[\s\S]*/i,"").trim();
  if(!r.giro){const giros=["fábrica","mueblería","tienda","restaurante","boutique","cafetería","distribuidora","inmobiliaria","clínica","consultorio","taller","agencia","ferretería","farmacia","hotel","gimnasio","escuela"];
    for(const x of giros){if(t.includes(x)){const rx=new RegExp(x+"\\s+de\\s+([^.,;\\n]{1,28})","i");const mm=txt.match(rx);r.giro=mm?(x+" de "+mm[1].trim()):x;break;}}}
  const sentences=txt.split(/[.\n;]+/).map(x=>x.trim()).filter(Boolean);
  sentences.forEach(sen=>{if(/problema|no s[eé]|no puede|dif[ií]cil|manual|excel|sin control|se pierde|a mano|retras|no tiene|cu[aá]nto/i.test(sen))r.problemas.push(sen);});
  const dict=[
    [/dashboard|tablero/, {n:"Dashboard de negocio",d:"Ver el rendimiento del negocio en tiempo real, desde el celular.",tag:"Decisiones con datos"}],
    [/inventario|existenc|stock/, {n:"Inventario inteligente",d:"Control de existencias, descuento por venta y alertas de faltantes.",tag:"Menos merma"}],
    [/producci|órden|orden de/, {n:"Control de producción",d:"Órdenes de producción, materiales y avance por etapa.",tag:"Producción bajo control"}],
    [/pedidos?/, {n:"Gestión de pedidos",d:"Registro y seguimiento de pedidos de principio a fin.",tag:"Pedidos ordenados"}],
    [/tiempos? de entrega|entregas?/, {n:"Tiempos de entrega",d:"Seguimiento de fechas y estatus de cada entrega.",tag:"Cumplir a tiempo"}],
    [/alertas?/, {n:"Alertas inteligentes",d:"Avisos automáticos de faltantes, retrasos y puntos críticos.",tag:"A tiempo, siempre"}],
    [/crm|clientes/, {n:"CRM de clientes",d:"Saber quién compra, qué se lleva y cada cuándo.",tag:"Base para vender mejor"}],
    [/whatsapp/, {n:"WhatsApp automatizado",d:"Atender y tomar pedidos sin estar pegado al teléfono.",tag:"Respuesta inmediata"}],
    [/p[aá]gina web|sitio web|landing/, {n:"Página web profesional",d:"Presencia digital y un lugar serio para mandar a los clientes.",tag:"Presencia y pedidos"}],
    [/\bpos\b|caja|punto de venta/, {n:"Caja / POS",d:"Punto de venta conectado a la base de datos.",tag:"Ventas registradas"}],
    [/lealtad|puntos/, {n:"Programa de lealtad",d:"Puntos y recompensas para que el cliente vuelva.",tag:"Más recompra"}],
    [/marketing/, {n:"Marketing automatizado",d:"Campañas y recuperación de clientes sin trabajo manual.",tag:"Ventas recurrentes"}],
    [/finan|utilidad|margen/, {n:"Dashboard financiero",d:"Rentabilidad y flujo real del negocio.",tag:"Margen real"}]
  ];
  const seen=new Set();
  for(const pair of dict){if(pair[0].test(t)&&!seen.has(pair[1].n)){seen.add(pair[1].n);r.modulos.push(Object.assign({},pair[1]));}}
  ["excel","shopify","woocommerce","sat","stripe","instagram","meta","whatsapp","sap","contpaqi","quickbooks","zebra"].forEach(x=>{if(t.includes(x))r.integraciones.push(x==="sat"?"SAT":cap(x));});
  return r;
}

function applyParsed(r){
  const s=state;
  if(r.giro)s.cliente.giro=cap(r.giro);
  if(r.problemas.length)s.prop.retos=r.problemas.slice(0,3).map(p=>({t:retoTitle(p),d:cap(p)+"."}));
  if(r.modulos.length)s.prop.modulos=r.modulos.map(m=>clone(m));
  const names=(r.modulos.length?r.modulos:s.prop.modulos).map(m=>m.n);
  s.prop.solT="Un sistema a la medida, todo conectado";
  s.prop.solD="Konekt propone un sistema que integra "+listJoin(names.map(n=>n.toLowerCase()))+" en un solo lugar"+(s.cliente.giro?(" para "+s.cliente.giro.toLowerCase()):"")+(r.integraciones.length?(", conectado con "+listJoin(r.integraciones)):"")+".";
  if(s.cliente.giro){s.prop.tituloB="tu negocio";s.prop.lead="Konekt propone un sistema a la medida para "+s.cliente.giro.toLowerCase()+", que ordena la operación y da control en tiempo real.";s.prop.heroT="Un solo sistema para "+(names.length?listJoin(names.slice(0,3).map(n=>n.toLowerCase())):"toda la operación")+".";}
  if(r.precio!=null)s.cot.conceptos=[{d:"Desarrollo e implementación del sistema"+(names.length?" ("+names.join(", ")+")":""),p:r.precio}];
  if(r.formaPago)s.meta.formaPago=r.formaPago;
  if(r.tiempo)s.meta.tiempo=r.tiempo;
  if(r.vencDias){s.meta.vencDias=r.vencDias;s.cot.vigencia="Válida por "+r.vencDias+" días a partir de la fecha de emisión.";}
}

const API_BASE=(window.KONEKT_API_BASE||"");
// El backend exige sesion en /api/*: sin esto cualquiera con la URL podria
// gastar el presupuesto de Anthropic. La cookie de sesion la manda el
// navegador sola; solo hay que pedir que la incluya.
async function apiFetch(ruta,cuerpo){
  const res=await fetch(API_BASE+ruta,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    credentials:"same-origin",
    body:JSON.stringify(cuerpo)
  });
  if(res.status===401) throw new Error("Tu sesión expiró. Vuelve a entrar.");
  if(res.status===429) throw new Error("Demasiadas peticiones seguidas. Espera un momento.");
  return res;
}
function val0(x){return (x!=null && x!=="No especificado" && x!=="")?x:null;}
function clampStr(s,max){s=String(s==null?"":s).trim();if(s.length<=max)return s;return s.slice(0,max-1).replace(/\s+\S*$/,"")+"…";}

async function analizar(){
  const el=document.getElementById("ctx");const txt=((el&&el.value)||state.contexto||"").trim();state.contexto=txt;
  if(!txt){state.aiStatus="Escribe primero el contexto arriba.";paintForm();return;}
  state.aiStatus="Analizando con Claude…";paintForm();
  try{
    const res=await apiFetch("/api/extract",{texto:txt});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||("HTTP "+res.status));}
    const d=await res.json();
    state.extraccion=d;mapExtract(d);state.analizado=true;
    const det=[];if(val0(d.empresa))det.push("empresa");if(val0(d.contacto))det.push("contacto");if(Array.isArray(d.modulos)&&d.modulos.length)det.push(d.modulos.length+" módulos");if(d.precio!=null)det.push("precio");if(Array.isArray(d.esquema_pagos)&&d.esquema_pagos.length)det.push("esquema de pagos");
    state.aiStatus="Extracción lista · "+(det.join(", ")||"revisa los campos")+". Corrige lo necesario y pulsa \"Redactar con IA\".";
    paintForm();paintPreview();
  }catch(err){
    state.aiStatus="No pude conectar con la IA ("+err.message+"). Inicia el backend (node server.js) y abre http://localhost:3000";
    paintForm();
  }
}

function mapExtract(d){
  const s=state;
  if(val0(d.empresa))s.cliente.empresa=d.empresa;
  if(val0(d.contacto))s.cliente.contacto=d.contacto;
  if(val0(d.puesto))s.cliente.puesto=d.puesto;
  if(val0(d.telefono))s.cliente.tel=d.telefono;
  if(val0(d.correo))s.cliente.correo=d.correo;
  if(val0(d.giro))s.cliente.giro=d.giro;
  if(val0(d.ubicacion))s.cliente.ubicacion=d.ubicacion;
  if(val0(d.descripcion_negocio))s.cliente.descripcion=d.descripcion_negocio;
  if(d.precio!=null && !isNaN(Number(d.precio))){
    const nm=(Array.isArray(d.modulos)&&d.modulos.length)?(" ("+d.modulos.map(m=>m.nombre||m).join(", ")+")"):"";
    s.cot.conceptos=[{d:"Desarrollo e implementación del sistema"+nm,p:Number(d.precio)}];
  }
  if(Array.isArray(d.esquema_pagos)&&d.esquema_pagos.length){
    s.meta.esquemaPagos=d.esquema_pagos.map(x=>({pct:Number(x.porcentaje)||0,c:val0(x.concepto)||""}));
    s.meta.formaPago=s.meta.esquemaPagos.map(x=>x.pct+"%"+(x.c?(" "+x.c):"")).join(" / ");
  } else { s.meta.esquemaPagos=[]; if(val0(d.esquema_pagos))s.meta.formaPago=String(d.esquema_pagos); }
  if(val0(d.tiempo_implementacion))s.meta.tiempo=d.tiempo_implementacion;
  if(val0(d.vigencia)){s.cot.vigencia=d.vigencia;const md=String(d.vigencia).match(/(\d+)\s*d[ií]a/);if(md)s.meta.vencDias=Number(md[1]);}
  if(typeof d.iva==="boolean")s.meta.iva=d.iva;
  if(Array.isArray(d.modulos)&&d.modulos.length){
    s.prop.modulos=d.modulos.map(m=>({n:clampStr(m.nombre||String(m),40),d:clampStr(Array.isArray(m.funcionalidades)?m.funcionalidades.join(", "):(m.descripcion||""),110),tag:""}));
  }
  s.extraIntegraciones=Array.isArray(d.integraciones)?d.integraciones.filter(x=>val0(x)):[];
  if(Array.isArray(d.problematica)&&d.problematica.length){
    s.prop.retos=d.problematica.slice(0,4).map((p,i)=>({t:"Punto "+String(i+1).padStart(2,"0"),d:clampStr(p,150)}));
  }
  if(val0(d.solucion)){s.prop.solT="Nuestra solución";s.prop.solD=clampStr(d.solucion,300);}
  s.prop.metricas=[];
}

async function redactar(){
  if(!state.analizado){state.aiStatus="Primero analiza el texto con IA.";paintForm();return;}
  state.aiStatus="Redactando propuesta con Claude…";paintForm();
  const datos={
    empresa:state.cliente.empresa,giro:state.cliente.giro,descripcion:state.cliente.descripcion,
    problematica:state.prop.retos.map(r=>r.d),
    solucion:state.prop.solD,
    modulos:state.prop.modulos.map(m=>({nombre:m.n,funcionalidades:m.d})),
    integraciones:state.extraIntegraciones||[],
    precio:(state.cot.conceptos[0]||{}).p||null,
    esquema_pagos:state.meta.esquemaPagos,tiempo:state.meta.tiempo,vigencia:state.cot.vigencia,
    metricas_proporcionadas:(state.extraccion&&state.extraccion.metricas_proporcionadas)||[]
  };
  try{
    const res=await apiFetch("/api/redactar",{datos});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||("HTTP "+res.status));}
    const r=await res.json();mapRedact(r);
    state.aiStatus="Propuesta redactada por Claude. Ajusta lo que quieras en \"Ajustes finos\".";
    paintForm();paintPreview();showDoc("prop");
  }catch(err){state.aiStatus="No pude redactar ("+err.message+"). ¿Está corriendo el backend?";paintForm();}
}

function mapRedact(r){
  const s=state;
  if(Array.isArray(r.reto)&&r.reto.length)s.prop.retos=r.reto.slice(0,4).map(x=>({t:clampStr(x.titulo||"",44),d:clampStr(x.desc||"",150)}));
  if(r.solucion){s.prop.solT=clampStr(r.solucion.titulo||"Nuestra solución",60);s.prop.solD=clampStr(r.solucion.desc||"",320);}
  if(Array.isArray(r.modulos)&&r.modulos.length)s.prop.modulos=r.modulos.map(m=>({n:clampStr(m.nombre||"",40),d:clampStr(m.desc||"",120),tag:clampStr(m.tag||"",28)}));
  if(Array.isArray(r.beneficios))s.prop.beneficios=r.beneficios.slice(0,6).map(b=>clampStr(b,72));
  s.prop.metricas=Array.isArray(r.metricas)?r.metricas.slice(0,4).map(m=>({big:clampStr(m.big||"",8),lb:clampStr(m.lb||"",22),ds:clampStr(m.ds||"",26)})):[];
  if(r.titulo){if(val0(r.titulo.a))s.prop.tituloA=clampStr(r.titulo.a,28);if(val0(r.titulo.b))s.prop.tituloB=clampStr(r.titulo.b,20);}
  if(val0(r.lead))s.prop.lead=clampStr(r.lead,190);
  if(val0(r.heroT))s.prop.heroT=clampStr(r.heroT,90);
}

function setPrecio(v){if(!state.cot.conceptos.length)state.cot.conceptos.push({d:"Desarrollo del sistema",p:0});state.cot.conceptos[0].p=Number(v||0);
  let sub=0;state.cot.conceptos.forEach(c=>sub+=Number(c.p)||0);const el=document.getElementById("precio-total");if(el)el.textContent="Total con IVA: "+money(sub*1.16);paintPreview();}
function setVigenciaDias(v){state.meta.vencDias=Number(v||0);state.cot.vigencia="Válida por "+(v||0)+" días a partir de la fecha de emisión.";paintPreview();}

/* ===============  ALMACENAMIENTO (capa aislada)  ===============
   Antes vivía en localStorage: las plantillas eran por navegador y no se
   compartían entre vendedores. Ahora están en la tabla `plantillas` de
   la base local. buildForm() es síncrono, así que la lista se precarga en
   initGenerador() y se guarda en `tplCache`. */
let tplCache=[];
const storage={
  list(){return tplCache.map(t=>t.nombre);},
  async refrescar(){
    try{ tplCache=await db.plantillas.listar(); }
    catch(e){ console.error("[plantillas]",e); tplCache=[]; }
  }
};
async function saveTpl(){
  const el=document.getElementById("tpl-name");
  const n=(el.value||"").trim();
  if(!n){el.focus();return;}
  try{
    await db.plantillas.guardar(n,clone(state));
    await storage.refrescar();
    el.value="";
    paintForm();
  }catch(e){ alert("No se pudo guardar la plantilla: "+e.message); }
}
// Se recibe el índice, no el nombre: así un nombre con apóstrofo no rompe
// el atributo onclick ni permite inyectar código.
async function loadTpl(i){
  const t=tplCache[i]; if(!t) return;
  try{
    const d=await db.plantillas.cargar(t.nombre);
    if(d){ state=clone(d); paintForm(); paintPreview(); }
  }catch(e){ alert("No se pudo cargar la plantilla: "+e.message); }
}
async function delTpl(i){
  const t=tplCache[i]; if(!t) return;
  if(!confirm(`¿Borrar la plantilla "${t.nombre}"?`)) return;
  try{
    await db.plantillas.borrar(t.nombre);
    await storage.refrescar();
    paintForm();
  }catch(e){ alert("No se pudo borrar la plantilla: "+e.message); }
}
function resetAll(){if(confirm("¿Limpiar todo y volver al ejemplo?")){state=baseState();paintForm();paintPreview();}}

/* ======  GENERADOR NATIVO DENTRO DE KONEKT SALES (diseño original intacto)  ====== */
function showDoc(w){const dp=document.getElementById("doc-prop"),dq=document.getElementById("doc-quote");if(!dp||!dq)return;const isP=w==="prop";dp.classList.toggle("hidden",!isP);dq.classList.toggle("hidden",isP);genDoc=w;const tp=document.getElementById("gtab-prop"),tq=document.getElementById("gtab-quote");if(tp)tp.classList.toggle("active",isP);if(tq)tq.classList.toggle("active",!isP);}
function renderGenerador(){const back=genOrigin!=null?`<button class="btn" onclick="openLead('${genOrigin}')">\u2190 Volver al prospecto</button>`:"";
 return `<div class="gen-toolbar">${back}<div class="gen-switch"><button id="gtab-prop" class="${genDoc==='prop'?'active':''}" onclick="showDoc('prop')">Propuesta comercial</button><button id="gtab-quote" class="${genDoc==='quote'?'active':''}" onclick="showDoc('quote')">Cotización</button></div><div class="spacer"></div><button class="btn" onclick="resetAll()">Limpiar</button><button class="btn primary" onclick="exportarPDF()">Exportar a PDF</button></div>
 <div class="layout genlayout"><aside class="editor" id="editor"></aside><section class="preview"><article id="doc-prop" class="doc"></article><article id="doc-quote" class="doc quote hidden"></article></section></div>`;}
function openGenerador(doc,origin){genDoc=doc||genDoc||"prop";genOrigin=(origin!=null)?origin:null;
 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===(genDoc==='quote'?'cotizaciones':'propuestas')));
 setTitle(genDoc==='quote'?'cotizaciones':'propuestas');
 const el=document.getElementById("view");el.innerHTML=renderGenerador();el.scrollTop=0;initGenerador();}
async function initGenerador(){
  paintForm(); paintPreview(); showDoc(genDoc);
  // Las plantillas viven en la base; se traen una vez y se repinta el formulario.
  if(db.configurado){ await storage.refrescar(); paintForm(); }
}
function exportarPDF(){window.print();}
